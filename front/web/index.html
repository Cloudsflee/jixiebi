<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:," />
  <title>Arm Twin Debug Panel</title>
  <link rel="stylesheet" href="./styles.css?v=20260518-012900" />
</head>
<body>
  <main class="app-shell">
    <section class="hero card">
      <div class="hero-head">
        <h1>Arm Twin Debug Panel</h1>
        <p>Live tuning for joint params and 3D linkage behavior</p>
      </div>
      <div class="gateway-row">
        <label for="wsUrl">WS URL</label>
        <input id="wsUrl" value="ws://127.0.0.1:8787" />
        <button id="connectBtn">Connect</button>
        <button id="pingBtn">PING</button>
        <button id="togglePanelBtn" class="ghost-btn">Hide Debug Panel</button>
        <button id="refreshPanelBtn" class="ghost-btn">Refresh Debug Panel</button>
        <span id="status">Gateway: not connected</span>
      </div>
    </section>

    <section class="workspace">
      <section class="viewer-card card">
        <div class="section-head">
          <h2>3D Viewer</h2>
          <p id="viewerStatus">Viewer: not loaded</p>
        </div>
        <div id="viewer"></div>
      </section>

      <section class="panel-card card">
        <div id="servoPanel"></div>
      </section>
    </section>

    <section class="log-card card">
      <div class="section-head">
        <h2>Log</h2>
      </div>
      <pre id="log">[BOOT] HTML loaded</pre>
    </section>
  </main>

  <script>
    (function bootDiag() {
      const logEl = document.getElementById("log");
      const append = (line) => {
        if (!logEl) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        logEl.textContent += `\n[${hh}:${mm}:${ss}] ${line}`;
      };

      append("inline bootstrap ok");
      let modernSyntaxOk = true;
      try {
        // Detect optional chaining/nullish coalescing support.
        // Older browsers fail here with SyntaxError.
        // eslint-disable-next-line no-new-func
        const fn = new Function("const a = null ?? 1; const o = { x: 2 }; return (o?.x ?? a);");
        fn();
        append("js syntax check: modern features supported");
      } catch (error) {
        modernSyntaxOk = false;
        append(`js syntax check: NOT supported (${String(error && error.message || error)})`);
        append("please open this page in a newer Chrome/Edge browser");
      }
      window.__MODERN_SYNTAX_OK__ = modernSyntaxOk;

      window.addEventListener("error", (evt) => {
        append(
          `window error: ${String(evt.message || evt.error || "unknown")} @ ` +
          `${String(evt.filename || "unknown")}:${String(evt.lineno || 0)}:${String(evt.colno || 0)}`
        );
      });
      window.addEventListener("unhandledrejection", (evt) => {
        append(`promise rejection: ${String(evt.reason || "unknown")}`);
      });
      window.setTimeout(() => {
        if (!window.__APP_MODULE_LOADED__) {
          append("app.js module not executed. Hard refresh (Ctrl+F5) and check /web/app.js?v=20260518-012900");
        } else {
          append(`app.js module loaded (${String(window.__APP_MODULE_STAMP__ || "unknown")})`);
        }
      }, 2000);
    })();
  </script>
  <script>
    (function loadAppModule() {
      if (!window.__MODERN_SYNTAX_OK__) return;
      const s = document.createElement("script");
      s.type = "module";
      s.src = "./app.js?v=20260518-012900";
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
